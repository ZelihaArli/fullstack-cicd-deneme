name: Fullstack CI

on:
  push:
    branches:
      - main

jobs:
  backend-check:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Backend paketlerini yükle
        working-directory: ./backend
        run: npm install

      - name: Backend syntax kontrolü
        working-directory: ./backend
        run: node -c server.js

  frontend-build:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Frontend paketlerini yükle
        working-directory: ./frontend
        run: npm install

      - name: Frontend build al
        working-directory: ./frontend
        run: npm run build
